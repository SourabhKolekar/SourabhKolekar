<svg width="680" height="696" viewBox="0 0 680 696" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .panel {
      fill: #ffffff;
      stroke: #d0d7de;
    }
    .header {
      fill: #f6f8fa;
    }
    .separator {
      stroke: #d8dee4;
    }
    .avatar {
      fill: #0969da;
    }
    .avatar-text {
      fill: #ffffff;
      font-size: 16px;
      font-weight: 700;
    }
    .name {
      fill: #1f2328;
      font-size: 18px;
      font-weight: 700;
    }
    .subtitle,
    .status,
    .tagline {
      fill: #656d76;
    }
    .subtitle {
      font-size: 13px;
    }
    .status {
      font-size: 12px;
    }
    .online {
      fill: #1a7f37;
    }
    .bubble {
      fill: #eff1f3;
    }
    .stack-bubble {
      fill: #ddf4ff;
    }
    .message-text {
      fill: #24292f;
      font-size: 16.5px;
    }
    .emphasis {
      font-weight: 700;
    }
    .stack {
      fill: #0550ae;
      font-size: 16px;
      font-weight: 600;
    }
    .tagline {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .emoji {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    }
    .typing {
      opacity: 0;
    }
    .typing rect {
      fill: #eff1f3;
    }
    .typing circle {
      fill: #8c959f;
    }
    .message {
      opacity: 0;
    }
    .typing-1 { animation: typing 0.95s ease 0.10s both; }
    .message-1 { animation: reveal 0.28s ease 1.08s forwards; }
    .typing-2 { animation: typing 0.95s ease 1.75s both; }
    .message-2 { animation: reveal 0.28s ease 2.73s forwards; }
    .typing-3 { animation: typing 0.95s ease 3.40s both; }
    .message-3 { animation: reveal 0.28s ease 4.38s forwards; }
    .typing-4 { animation: typing 0.95s ease 5.05s both; }
    .message-4 { animation: reveal 0.28s ease 6.03s forwards; }
    .typing-5 { animation: typing 0.95s ease 6.70s both; }
    .message-5 { animation: reveal 0.28s ease 7.68s forwards; }
    .typing-6 { animation: typing 0.95s ease 8.35s both; }
    .message-6 { animation: reveal 0.28s ease 9.33s forwards; }
    .tagline { opacity: 0; animation: reveal 0.35s ease 9.95s forwards; }

    @keyframes typing {
      0%, 100% { opacity: 0; }
      12%, 86% { opacity: 1; }
    }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-color-scheme: dark) {
      .panel {
        fill: #0d1117;
        stroke: #30363d;
      }
      .header {
        fill: #161b22;
      }
      .separator {
        stroke: #30363d;
      }
      .name,
      .message-text {
        fill: #e6edf3;
      }
      .subtitle,
      .status,
      .tagline {
        fill: #8b949e;
      }
      .bubble,
      .typing rect {
        fill: #21262d;
      }
      .stack-bubble {
        fill: #0c2d4a;
      }
      .stack {
        fill: #79c0ff;
      }
      .typing circle {
        fill: #7d8590;
      }
      .online {
        fill: #3fb950;
      }
    }
  </style>

  <rect x="1" y="1" width="678" height="694" rx="22" class="panel" />
  <path d="M23 1H657C669.15 1 679 10.85 679 23V83H1V23C1 10.85 10.85 1 23 1Z" class="header" />
  <line x1="1" y1="83.5" x2="679" y2="83.5" class="separator" />

  <circle cx="49" cy="42" r="25" class="avatar" />
  <text x="49" y="48" text-anchor="middle" class="avatar-text">SK</text>
  <text x="86" y="35" class="name">Sourabh Kolekar</text>
  <text x="86" y="57" class="subtitle">Backend Engineer · Cloud &amp; Event-Driven Systems · Melbourne</text>
  <circle cx="500" cy="29" r="4.5" class="online" />
  <text x="510" y="33" class="status">online · Sunday · 14°C <tspan class="emoji">☀️</tspan></text>

  <g class="typing typing-1" transform="translate(30 123)">
    <rect width="66" height="40" rx="20" />
    <circle cx="22" cy="20" r="4" />
    <circle cx="33" cy="20" r="4" />
    <circle cx="44" cy="20" r="4" />
  </g>
  <g class="message message-1">
    <rect x="22" y="99" width="540" height="92" rx="19" class="bubble" />
    <text x="40" y="127" class="message-text">
      <tspan x="40" dy="0" class="emphasis">Hey, I’m Sourabh <tspan class="emoji">👋</tspan></tspan>
      <tspan x="40" dy="25">I turn ambiguous, cross-team problems into</tspan>
      <tspan x="40" dy="25">reliable production systems.</tspan>
    </text>
  </g>

  <g class="typing typing-2" transform="translate(30 214)">
    <rect width="66" height="40" rx="20" />
    <circle cx="22" cy="20" r="4" />
    <circle cx="33" cy="20" r="4" />
    <circle cx="44" cy="20" r="4" />
  </g>
  <g class="message message-2">
    <rect x="22" y="201" width="610" height="67" rx="19" class="bubble" />
    <text x="40" y="229" class="message-text">
      <tspan x="40" dy="0">My work spans APIs, event-driven workflows and batch pipelines,</tspan>
      <tspan x="40" dy="25">integrations, performance and observability.</tspan>
    </text>
  </g>

  <g class="typing typing-3" transform="translate(30 291)">
    <rect width="66" height="40" rx="20" />
    <circle cx="22" cy="20" r="4" />
    <circle cx="33" cy="20" r="4" />
    <circle cx="44" cy="20" r="4" />
  </g>
  <g class="message message-3">
    <rect x="22" y="278" width="510" height="67" rx="19" class="stack-bubble" />
    <text x="40" y="306" class="stack">
      <tspan x="40" dy="0">Java · Kotlin · Spring Boot · AWS · GCP</tspan>
      <tspan x="40" dy="25">PostgreSQL · MySQL · DynamoDB</tspan>
    </text>
  </g>

  <g class="typing typing-4" transform="translate(30 379)">
    <rect width="66" height="40" rx="20" />
    <circle cx="22" cy="20" r="4" />
    <circle cx="33" cy="20" r="4" />
    <circle cx="44" cy="20" r="4" />
  </g>
  <g class="message message-4">
    <rect x="22" y="355" width="636" height="92" rx="19" class="bubble" />
    <text x="40" y="383" class="message-text">
      <tspan x="40" dy="0">At <tspan class="emphasis">EatClub</tspan>, I build and own systems across customer engagement,</tspan>
      <tspan x="40" dy="25">recommendations, operational integrations, reporting</tspan>
      <tspan x="40" dy="25">and internal tooling.</tspan>
    </text>
  </g>

  <g class="typing typing-5" transform="translate(30 470)">
    <rect width="66" height="40" rx="20" />
    <circle cx="22" cy="20" r="4" />
    <circle cx="33" cy="20" r="4" />
    <circle cx="44" cy="20" r="4" />
  </g>
  <g class="message message-5">
    <rect x="22" y="457" width="575" height="67" rx="19" class="bubble" />
    <text x="40" y="485" class="message-text">
      <tspan x="40" dy="0">Previously at <tspan class="emphasis">Bilue</tspan>, delivering software across</tspan>
      <tspan x="40" dy="25">Qantas, AMP and Guzman y Gomez.</tspan>
    </text>
  </g>

  <g class="typing typing-6" transform="translate(30 558)">
    <rect width="66" height="40" rx="20" />
    <circle cx="22" cy="20" r="4" />
    <circle cx="33" cy="20" r="4" />
    <circle cx="44" cy="20" r="4" />
  </g>
  <g class="message message-6">
    <rect x="22" y="534" width="636" height="92" rx="19" class="bubble" />
    <text x="40" y="562" class="message-text">
      <tspan x="40" dy="0">After hours: product ideas, side projects, badminton, anime—</tspan>
      <tspan x="40" dy="25">and optimising things nobody asked me to optimise.</tspan>
      <tspan x="40" dy="25">Then there’s always a game I’ll definitely finish someday. <tspan class="emoji">🏸🎮</tspan></tspan>
    </text>
  </g>

  <text x="340" y="671" text-anchor="middle" class="tagline">Pragmatic architecture · Measurable outcomes · Systems teams can trust</text>
</svg>
