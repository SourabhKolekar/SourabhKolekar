name: Readme Text

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate profile SVG
        env:
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
        run: node build-svg.js

      - name: Commit changes
        run: |
          git config user.name "Sourabh Kolekar"
          git config user.email "hello@sourabhkolekar.com"
          git add chat.svg

          if git diff --cached --quiet; then
            echo "No profile changes to commit"
            exit 0
          fi

          git commit -m "Auto updating my readme"
          git push
